name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: mmo, POSTGRES_PASSWORD: mmo, POSTGRES_DB: mmo_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mmo" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: backend
        working-directory: backend
        run: |
          uv sync -p 3.12
          uv run ruff check . && uv run ruff format --check . && uv run mypy app
          uv run pytest -q
          uv run python -m scripts.check_migrations
      - name: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint && npm run typecheck && npm test && npm run build
      - name: e2e
        run: |
          createdb -h localhost -U mmo mmo_e2e || true
          cd frontend && npx playwright install --with-deps chromium && cd ..
          scripts/e2e.sh
        env: {PGPASSWORD: mmo}
