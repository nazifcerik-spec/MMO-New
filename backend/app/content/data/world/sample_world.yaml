ability_profiles:
  brute_smash:
    abilities: [{code: heavy_smash, tags: [single_target], cooldown_s: 8, effects: [{effect_type: DAMAGE, params: {percent_of_power: 180}}]}]
    rules: [{use: {ability: heavy_smash}}]
    l10n: {name: {en: Brute, tr: Kaba Kuvvet, zh-CN: 蛮力, es: Bruto}}
  skirmisher_bleed:
    abilities: [{code: rending_cut, tags: [dot], cooldown_s: 10, effects: [{effect_type: DOT, params: {percent_of_power: 25, duration_s: 8, tick_s: 2}}]}]
    rules: [{use: {ability: rending_cut}, when: [{kind: DEBUFF_PRESENT, op: eq, value: 0, code: dot}]}]
    l10n: {name: {en: Skirmisher, tr: Akıncı, zh-CN: 游击, es: Escaramuzador}}
  caster_bolt:
    abilities: [{code: dark_bolt, tags: [single_target], cooldown_s: 6, cast_time_s: 1, effects: [{effect_type: DAMAGE, params: {percent_of_power: 160, damage_type: shadow}}]}]
    rules: [{use: {ability: dark_bolt}}]
    l10n: {name: {en: Caster, tr: Büyücü, zh-CN: 施法者, es: Lanzador}}
  boss_warlord:
    abilities:
      - {code: sweeping_blow, target: enemy_all, tags: [aoe], cooldown_s: 12, effects: [{effect_type: DAMAGE, params: {percent_of_power: 120}}]}
      - {code: crushing_strike, tags: [single_target], cooldown_s: 18, cast_time_s: 2, effects: [{effect_type: DAMAGE, params: {percent_of_power: 320}}]}
    rules:
      - {use: {ability: crushing_strike}, when: [{kind: TARGET_HP, op: lt, value: 60}]}
      - {use: {ability: sweeping_blow}}
    l10n: {name: {en: Warlord, tr: Savaş Lordu, zh-CN: 军阀, es: Señor de la guerra}}

