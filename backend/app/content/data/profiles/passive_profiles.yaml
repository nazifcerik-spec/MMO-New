      name: {en: Totemic, tr: Totemci, zh-CN: 图腾, es: Totémico}
      description: {en: "Totem slot priority with spirit procs.", tr: "Ruh tetiklenmeleriyle totem yuvası önceliği.", zh-CN: 图腾槽位优先并触发灵魂。, es: "Prioridad de tótems con activaciones espirituales."}
  - code: shaman_hexer
    class: shaman
    defaults: {stance: aggressive, target_priority: highest_hp, potion_threshold_pct: 35}
    rules:
      - {use: {ability: hex}, when: [{kind: DEBUFF_PRESENT, op: eq, value: 0}]}
      - {use: {ability: storm_totem_skill}, when: [{kind: BUFF_PRESENT, op: eq, value: 0, code: storm_totem_skill}]}
      - {use: {ability: spirit_mend}, when: [{kind: HP_PERCENT, op: lt, value: 50}]}
    effects: []
    l10n:
      name: {en: Hexer, tr: Lanetçi, zh-CN: 咒术师, es: Maleficiador}
      description: {en: "Hexes and storm totems for damage.", tr: "Hasar için lanetler ve fırtına totemleri.", zh-CN: 以诅咒和风暴图腾造成伤害。, es: "Maleficios y tótems de tormenta para dañar."}
