      - {use: {ability: thorn_ward}, when: [{kind: BUFF_PRESENT, op: eq, value: 0, code: thorn_ward}]}
      - {use: {ability: moonfire}, when: [{kind: DEBUFF_PRESENT, op: eq, value: 0, code: dot}, {kind: RESOURCE_PERCENT, op: gte, value: 60}]}
      - {use: {ability: entangle}, when: [{kind: ENEMY_COUNT, op: gte, value: 2}]}
    effects: []
    l10n:
      name: {en: Grove Warden, tr: Koru Bekçisi, zh-CN: 林地守望, es: Guardián del bosque}
      description: {en: "HoT refresh, bear form under threshold, thorns always up.", tr: "Zamanla şifa yenileme, eşik altında ayı formu, dikenler hep açık.", zh-CN: 刷新持续治疗，低于阈值变熊，荆棘常驻。, es: "Renueva CeT, forma de oso bajo umbral, espinas siempre activas."}
  - code: druid_feral
    class: druid
    defaults: {stance: aggressive, target_priority: lowest_hp, potion_threshold_pct: 35}
    rules:
