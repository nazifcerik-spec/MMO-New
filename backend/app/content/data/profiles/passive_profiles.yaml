      - {use: {ability: storm_totem_skill}, when: [{kind: BUFF_PRESENT, op: eq, value: 0, code: storm_totem_skill}]}
      - {use: {ability: ancestor_call}, when: [{kind: RESOURCE_PERCENT, op: gte, value: 60}]}
      - {use: {ability: hex}, when: [{kind: DEBUFF_PRESENT, op: eq, value: 0}, {kind: RESOURCE_PERCENT, op: gte, value: 30}]}
    effects:
      - {effect_type: PROC_CHANCE, params: {chance_percent: 15, trigger: on_hit, effects: [{effect_type: RESOURCE_GAIN, params: {resource: spirit_charges, amount: 1}}]}}
