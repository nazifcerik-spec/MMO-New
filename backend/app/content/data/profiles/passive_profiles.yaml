      - {use: {ability: regrowth}, when: [{kind: HP_PERCENT, op: lt, value: 60}]}
      - {use: {ability: entangle}, when: [{kind: ENEMY_COUNT, op: gte, value: 2}]}
    effects: []
    l10n:
      name: {en: Feral, tr: Vahşi, zh-CN: 野性, es: Salvaje}
      description: {en: "Starts in bear form and keeps moonfire rolling.", tr: "Ayı formunda başlar ve ay ateşini sürdürür.", zh-CN: 以熊形态开场并维持月火术。, es: "Empieza en forma de oso y mantiene el fuego lunar."}
  - code: bard_ensemble
    class: bard
    defaults: {stance: efficient, target_priority: lowest_hp, potion_threshold_pct: 40}
    rules:
      - {use: {ability: healing_verse}, when: [{kind: ALLY_HP_BELOW, value: 75}]}
      - {use: {ability: song_of_valor}, when: [{kind: BUFF_PRESENT, op: eq, value: 0, code: song_of_valor}]}
      - {use: {ability: quick_tempo}, when: [{kind: BUFF_PRESENT, op: eq, value: 0, code: quick_tempo}]}
      - {use: {ability: dissonant_chord}, when: [{kind: DEBUFF_PRESENT, op: eq, value: 0}]}
      - {use: {ability: encore}, when: [{kind: RESOURCE_PERCENT, op: gte, value: 40}]}
    effects:
      - {effect_type: PROC_CHANCE, params: {chance_percent: 25, trigger: on_hit, effects: [{effect_type: DAMAGE, params: {percent_of_power: 45, damage_type: arcane}}]}}
    l10n:
      name: {en: Ensemble, tr: Topluluk, zh-CN: 合奏, es: Conjunto}
      description: {en: "Song rotation driven by party condition.", tr: "Grubun durumuna göre şarkı rotasyonu.", zh-CN: 根据队伍状态轮换歌曲。, es: "Rotación de canciones según el estado del grupo."}
  - code: bard_discordant
    class: bard
    defaults: {stance: aggressive, target_priority: highest_hp, potion_threshold_pct: 35}
    rules:
      - {use: {ability: dissonant_chord}, when: [{kind: DEBUFF_PRESENT, op: eq, value: 0}]}
      - {use: {ability: song_of_valor}, when: [{kind: BUFF_PRESENT, op: eq, value: 0, code: song_of_valor}]}
      - {use: {ability: healing_verse}, when: [{kind: HP_PERCENT, op: lt, value: 50}]}
    effects: []
    l10n:
      name: {en: Discordant, tr: Ahenksiz, zh-CN: 不谐, es: Discordante}
      description: {en: "Debuffs first, valor song upkeep.", tr: "Önce zayıflatmalar, yiğitlik şarkısını sürdür.", zh-CN: 优先减益，保持勇气之歌。, es: "Primero perjuicios, mantiene la canción del valor."}
  - code: shaman_totemic
    class: shaman
    defaults: {stance: efficient, target_priority: lowest_hp, potion_threshold_pct: 40}
    rules:
      - {use: {ability: spirit_mend}, when: [{kind: ALLY_HP_BELOW, value: 78}]}
