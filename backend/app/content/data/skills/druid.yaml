class: druid
abilities:
  - code: regrowth
    type: ACTIVE
    unlock_level: 1
    target: lowest_hp_ally
    tags: [heal, hot]
    cost: {resource: nature_essence, amount: 8}
    cooldown_s: 4
    effects: [{effect_type: HOT, params: {percent_of_power: 25, duration_s: 12, tick_s: 2, target: lowest_hp_ally}}]
    l10n:
      name: {en: Regrowth, tr: Yeniden Büyüme, zh-CN: 愈合, es: Recrecimiento}
      description: {en: Heal over time., tr: Zamanla şifa., zh-CN: 持续治疗。, es: Curación en el tiempo.}
  - code: entangle
    type: ACTIVE
    unlock_level: 10
    target: enemy_single
    tags: [debuff]
    cost: {resource: nature_essence, amount: 12}
    cooldown_s: 15
    effects: [{effect_type: DEBUFF, params: {kind: root, duration_s: 4}}]
    l10n:
      name: {en: Entangle, tr: Dolaştır, zh-CN: 纠缠根须, es: Enredar}
      description: {en: Roots the target., tr: Hedefi köklendirir., zh-CN: 定身目标。, es: Enraíza al objetivo.}
  - code: thorn_ward
    type: ACTIVE
    unlock_level: 25
    target: party
    tags: [buff]
    cost: {resource: nature_essence, amount: 15}
    cooldown_s: 20
    effects: [{effect_type: BUFF, params: {duration_s: 12, target: party, effects: [{effect_type: PROC_CHANCE, params: {chance_percent: 100, trigger: on_damage_taken, effects: [{effect_type: DAMAGE, params: {percent_of_power: 15, damage_type: nature}}]}}]}}]
    l10n:
      name: {en: Thorn Ward, tr: Diken Koruması, zh-CN: 荆棘护佑, es: Guarda espinosa}
      description: {en: Reflect buff., tr: Yansıtma güçlendirmesi., zh-CN: 反伤增益。, es: Mejora de reflejo.}
  - code: bear_form_skill
    type: STANCE
    unlock_level: 40
    target: self
    tags: [defensive, form]
    cost: null
    cooldown_s: 10
    effects: [{effect_type: STAT_PERCENT, params: {stat: max_hp, percent: 15}}, {effect_type: STAT_PERCENT, params: {stat: armor, percent: 25}}]
    l10n:
      name: {en: Bear Form, tr: Ayı Formu, zh-CN: 熊形态, es: Forma de oso}
      description: {en: Tank stance., tr: Tank duruşu., zh-CN: 坦克姿态。, es: Postura de tanque.}
  - code: moonfire
    type: ACTIVE
    unlock_level: 60
    target: enemy_single
    tags: [dot, single_target]
    cost: {resource: nature_essence, amount: 10}
    cooldown_s: 6
    effects: [{effect_type: DAMAGE, params: {percent_of_power: 45, damage_type: arcane}}, {effect_type: DOT, params: {damage_type: arcane, percent_of_power: 8, duration_s: 12, tick_s: 2}}]
    l10n:
      name: {en: Moonfire, tr: Ay Ateşi, zh-CN: 月火术, es: Fuego lunar}
      description: {en: Magic damage over time., tr: Zamanla büyü hasarı., zh-CN: 持续魔法伤害。, es: Daño mágico en el tiempo.}
  - code: tranquility
    type: ULTIMATE
    unlock_level: 600
    target: party
    tags: [heal, aoe]
    cost: {resource: nature_essence, amount: 80}
    cooldown_s: 150
    effects: [{effect_type: HOT, params: {percent_of_power: 60, duration_s: 10, tick_s: 1, target: party}}]
    l10n:
      name: {en: Tranquility, tr: Dinginlik, zh-CN: 宁静, es: Tranquilidad}
      description: {en: A wave of healing sweeps over the party., tr: Bir şifa dalgası grubu sarar., zh-CN: 治疗之潮席卷全队。, es: Una ola de curación envuelve al grupo.}
  - code: photosynthesis
    type: PASSIVE
    unlock_level: 15
    effects: [{effect_type: STAT_PERCENT, params: {stat: hp_regen, percent: 20}}]
    l10n:
      name: {en: Photosynthesis, tr: Fotosentez, zh-CN: 光合作用, es: Fotosíntesis}
      description: {en: Regeneration out of combat., tr: Savaş dışında yenilenme., zh-CN: 脱战回复。, es: Regeneración fuera de combate.}
  - code: natural_harmony
    type: PASSIVE
    unlock_level: 30
    effects: [{effect_type: SCALING_BONUS, params: {metric: active_hot_count, step: 1, percent_per_step: 2, max_percent: 8, applies_to: healing}}]
    l10n:
      name: {en: Natural Harmony, tr: Doğal Uyum, zh-CN: 自然和谐, es: Armonía natural}
      description: {en: Overlapping HoTs grow stronger., tr: Üst üste binen zamanla şifalar güçlenir., zh-CN: 叠加的持续治疗更强。, es: Las CeT superpuestas se fortalecen.}
  - code: wild_instinct
    type: PROC
    unlock_level: 45
    effects: [{effect_type: PROC_CHANCE, params: {chance_percent: 100, trigger: on_ability_cast, internal_cooldown_s: 5, effects: [{effect_type: RESOURCE_GAIN, params: {resource: nature_essence, amount: 5}}]}}]
    l10n:
      name: {en: Wild Instinct, tr: Yaban İçgüdüsü, zh-CN: 野性本能, es: Instinto salvaje}
      description: {en: Form switches grant resource., tr: Form değişimi kaynak verir., zh-CN: 切换形态获得资源。, es: Cambiar de forma otorga recurso.}
trees:
  - code: growth
    l10n:
      name: {en: Growth, tr: Büyüme, zh-CN: 生长, es: Crecimiento}
      focus: {en: "HoT, regen, bloom", tr: "Zamanla şifa, yenilenme, çiçeklenme", zh-CN: 持续治疗、回复、绽放, es: "CeT, regeneración, floración"}
    focus:
      - {archetype: growth, effects: [{effect_type: HEAL_MULTIPLIER, params: {percent: 2, scope: hot}}]}
      - {archetype: mending, effects: [{effect_type: HEAL_MULTIPLIER, params: {percent: 1}}]}
      - {archetype: clarity, effects: [{effect_type: STAT_PERCENT, params: {stat: resource_regen, percent: 2}}]}
      - {archetype: devotion, effects: [{effect_type: STAT_PERCENT, params: {stat: healing_power, percent: 1}}]}
      - {archetype: vitality, effects: [{effect_type: STAT_PERCENT, params: {stat: hp_regen, percent: 4}}]}
    capstone:
      code: world_tree
      effects: [{effect_type: EVERY_N_HITS, params: {n: 5, effects: [{effect_type: HEAL, params: {percent_of_power: 80, target: party}}]}}]
      l10n:
        name: {en: World Tree, tr: Dünya Ağacı, zh-CN: 世界之树, es: Árbol del mundo}
        description: {en: Healing periodically blooms over the party., tr: Şifa düzenli olarak gruba yayılır., zh-CN: 治疗周期性地为全队绽放。, es: La curación florece periódicamente sobre el grupo.}
  - code: wild
    l10n:
      name: {en: Wild, tr: Yaban, zh-CN: 野性, es: Salvaje}
      focus: {en: "Forms, HP, attack", tr: "Formlar, can, saldırı", zh-CN: 形态、生命、攻击, es: "Formas, PS, ataque"}
    focus:
      - {archetype: wild_bond, effects: [{effect_type: STAT_PERCENT, params: {stat: form_power, percent: 2}}]}
      - {archetype: fortitude, effects: [{effect_type: STAT_PERCENT, params: {stat: max_hp, percent: 1}}]}
      - {archetype: ferocity, effects: [{effect_type: STAT_PERCENT, params: {stat: attack_power, percent: 1}}]}
      - {archetype: vitality, effects: [{effect_type: STAT_PERCENT, params: {stat: armor, percent: 2}}]}
      - {archetype: brutality, effects: [{effect_type: DAMAGE_MULTIPLIER, params: {percent: 1}}]}
    capstone:
      code: primal_avatar
      effects: [{effect_type: STAT_PERCENT, params: {stat: form_power, percent: 25}}, {effect_type: STAT_PERCENT, params: {stat: max_hp, percent: 5}}]
      l10n:
        name: {en: Primal Avatar, tr: İlkel Avatar, zh-CN: 原始化身, es: Avatar primigenio}
        description: {en: Forms become far more powerful., tr: Formlar çok daha güçlü olur., zh-CN: 形态威力大幅提升。, es: Las formas se vuelven mucho más poderosas.}
  - code: nature
    l10n:
      name: {en: Nature, tr: Doğa, zh-CN: 自然, es: Naturaleza}
      focus: {en: "Poison, root, thorn", tr: "Zehir, kök, diken", zh-CN: 毒素、定身、荆棘, es: "Veneno, raíz, espina"}
    focus:
      - {archetype: thornweave, effects: [{effect_type: DAMAGE_MULTIPLIER, params: {percent: 2, damage_type: nature}}]}
      - {archetype: toxicity, effects: [{effect_type: DAMAGE_MULTIPLIER, params: {percent: 2, damage_type: poison}}]}
      - {archetype: cunning, effects: [{effect_type: STAT_FLAT, params: {stat: debuff_duration, amount: 2}}]}
      - {archetype: arcane_power, effects: [{effect_type: STAT_PERCENT, params: {stat: spell_power, percent: 1}}]}
      - {archetype: guarding, effects: [{effect_type: DAMAGE_REDUCTION, params: {percent: 1}}]}
    capstone:
      code: natures_wrath
      effects: [{effect_type: PROC_CHANCE, params: {chance_percent: 20, trigger: on_hit, effects: [{effect_type: DOT, params: {damage_type: nature, percent_of_power: 20, duration_s: 8, max_stacks: 3}}]}}]
      l10n:
        name: {en: "Nature's Wrath", tr: Doğanın Gazabı, zh-CN: 自然之怒, es: Ira de la naturaleza}
        description: {en: Attacks often unleash thorny venom., tr: Saldırılar sık sık dikenli zehir salar., zh-CN: 攻击时常释放荆棘毒素。, es: Los ataques desatan a menudo veneno espinoso.}
