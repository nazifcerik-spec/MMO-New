# Legendary+/relic effect templates by category (values scale with tier) --------------------------------------
unique_effects:
  weapon: {stat: crit_chance, base: 1.0, per_tier: 0.3}
  armor: {stat: max_hp, base: 2.0, per_tier: 0.4, percent: true}
  accessory: {stat: crit_chance, base: 0.8, per_tier: 0.25}
  profession_tool: {profession_kind: rare_find, base: 4, per_tier: 1}
# Stat budget outlier report: power = Σ amount × weight, compared with the (category, slot-agnostic) tier median.
stat_weights: {attack_power: 1.0, spell_power: 1.0, buff_power: 30.0, accuracy: 40.0, armor: 0.5, max_hp: 0.8,
               magic_resist: 0.6, dodge: 40.0, block: 30.0, crit_chance: 25.0}
outlier_band: [0.55, 1.6]
