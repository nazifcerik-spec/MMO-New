# Launch item catalog (canonical): exactly 1,520 templates generated deterministically from these tokens.
# Codes are derived from stable token codes + tier + index and never change on regeneration.
# EN names are canonical (published); TR / ZH-CN / ES are machine-assembled drafts for translator review.
version: 1
targets: {weapon: 280, armor: 360, accessory: 120, profession_tool: 90, consumable: 160, material: 240,
          recipe: 120, quest_key_token: 80, cosmetic_collectible: 70}
locales: [en, tr, zh-CN, es]
# Name assembly per locale ({epithet} {material} {family} {noun} / {grade}); empty tokens collapse.
patterns:
  equipment: {en: "{epithet} {material} {family} {noun}", tr: "{epithet} {material} {family} {noun}", zh-CN: "{epithet}{material}{family}{noun}", es: "{noun} {family} {material} {epithet}"}
  graded:    {en: "{grade} {epithet} {noun}", tr: "{grade} {epithet} {noun}", zh-CN: "{grade}{epithet}{noun}", es: "{noun} {grade} {epithet}"}
  recipe:    {en: "{noun}: {grade} {epithet}", tr: "{noun}: {grade} {epithet}", zh-CN: "{noun}：{grade}{epithet}", es: "{noun}: {grade} {epithet}"}
